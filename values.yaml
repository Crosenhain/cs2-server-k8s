---
namespace: cs2
image:
  repository: ghcr.io/kus/cs2-modded-server
  pullPolicy: Always
  tag: latest
service:
  type: LoadBalancer
  port: 27015
  # Bind the game port directly on the node the pod runs on. Preserves real
  # client IPs, which k3s ServiceLB (klipper) masquerades away. hostPort always
  # mirrors service.port so the port advertised to Steam matches the reachable
  # one. Set service.type: ClusterIP alongside this.
  hostPort: false
secrets:
  existingSecret: my-pre-created-secret
  # steamAccount: ""
  # apiKey: ""
  # rconPassword: ""
  # serverPassword: ""
  # duckToken: ""
  # duckDomain: ""
persistence:
  dataHostPath: /path/to/local/data-cs2/game/
  customHostPath: /path/to/local/data-cs2/custom_files/
nodeSelector:
  kubernetes.io/hostname: servername
env:
  exec: "on_boot.cfg"
  modBranch: "main"
  customFolder: "custom_files"
  bits: 64
  ip: ""
  tickrate: 128
  map: "de_dust2"
  maxPlayers: 14
  gameType: 0
  gameMode: 0
  mapGroup: "mg_active"
  lan: 0
  workshopCollection: "1234"
  # When workshopCollection is set, the entrypoint resolves it to member maps,
  # writes csgo/gamemodes_server.txt, and launches with +mapgroup mapgroupName
  # (overrides mapGroup above). This is what puts workshop maps in the
  # end-of-match vote. Leave workshopStartMap empty to boot the first member.
  mapgroupName: "mg_workshop"
  workshopStartMap: ""
  removeAppmanifestOnStart: false
  performValidationOnStart: false
watcher:
  enabled: true
  schedule: '*/15 * * * *'
  # Consecutive runs with an unreachable RCON before the watcher restarts
  # without a confirmed player count. 0 disables blind restarts, so a broken
  # RCON means the server never auto-updates again. 4 is ~1h on the schedule
  # above.
  blindRestartAfterFailures: 4
  image:
    repository: ghcr.io/kus/cs2-modded-server
    tag: latest
