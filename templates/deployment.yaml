---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "cs2-server.fullname" .}}
  labels:
    {{- include "cs2-server.labels" . | nindent 4}}
  namespace: {{.Values.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cs2-server.selectorLabels" . | nindent 6}}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "cs2-server.selectorLabels" . | nindent 8}}
    spec:
      {{- with .Values.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8}}
      {{- end}}
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{.Chart.Name}}
          image: "{{.Values.image.repository}}:{{.Values.image.tag
            | default .Chart.AppVersion}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: {{.Values.service.port}}
              protocol: TCP
              {{- if .Values.service.hostPort}}
              hostPort: {{.Values.service.port}}
              {{- end}}
            - containerPort: {{.Values.service.port}}
              protocol: UDP
              {{- if .Values.service.hostPort}}
              hostPort: {{.Values.service.port}}
              {{- end}}
          env:
            - name: STEAM_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                    | default (printf "%s-secret" (
                    include "cs2-server.fullname" .))}}
                  key: STEAM_ACCOUNT
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                    | default (printf "%s-secret" (
                    include "cs2-server.fullname" .))}}
                  key: API_KEY
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                   | default (printf "%s-secret" (
                   include "cs2-server.fullname" .))}}
                  key: RCON_PASSWORD
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                    | default (printf "%s-secret" (
                    include "cs2-server.fullname" .))}}
                  key: SERVER_PASSWORD
            - name: DUCK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                    | default (printf "%s-secret" (
                    include "cs2-server.fullname" .))}}
                  key: DUCK_TOKEN
                  optional: true
            - name: DUCK_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secrets.existingSecret
                    | default (printf "%s-secret" (
                    include "cs2-server.fullname" .))}}
                  key: DUCK_DOMAIN
                  optional: true
            - name: EXEC
              value: {{.Values.env.exec | quote}}
            - name: PORT
              value: {{.Values.service.port | quote}}
            - name: MOD_BRANCH
              value: {{.Values.env.modBranch | quote}}
            - name: CUSTOM_FOLDER
              value: {{.Values.env.customFolder | quote}}
            - name: BITS
              value: {{.Values.env.bits | quote}}
            - name: IP
              value: {{.Values.env.ip | quote}}
            - name: TICKRATE
              value: {{.Values.env.tickrate | quote}}
            - name: MAP
              value: {{.Values.env.map | quote}}
            - name: MAXPLAYERS
              value: {{.Values.env.maxPlayers | quote}}
            - name: GAME_TYPE
              value: {{.Values.env.gameType | quote}}
            - name: GAME_MODE
              value: {{.Values.env.gameMode | quote}}
            - name: MAP_GROUP
              value: {{.Values.env.mapGroup | quote}}
            - name: LAN
              value: {{.Values.env.lan | quote}}
            - name: CS2_WORKSHOP_COLLECTION
              value: {{.Values.env.workshopCollection | quote}}
            - name: MAPGROUP_NAME
              value: {{.Values.env.mapgroupName | default "mg_workshop" | quote}}
            - name: WORKSHOP_START_MAP
              value: {{.Values.env.workshopStartMap | default "" | quote}}
            # Not piped through `default`: Helm treats false as empty, so a
            # `default` here would silently ignore anyone setting these false.
            # The script's own ${VAR:-false} covers an unset value.
            - name: REMOVE_APP_MANIFEST_ON_START
              value: {{.Values.env.removeAppmanifestOnStart | quote}}
            - name: VALIDATE_ON_START
              value: {{.Values.env.performValidationOnStart | quote}}
          volumeMounts:
            - name: cs2-data
              mountPath: /home/steam/cs2
            - name: custom
              mountPath: /home/custom_files/
            - name: install-script
              mountPath: /home/cs2-modded-server/install_docker.sh
              subPath: install_docker.sh
            # install_docker.sh resolves this by its own dirname, so it has to
            # land beside it.
            - name: install-script
              mountPath: /home/cs2-modded-server/workshop.py
              subPath: workshop.py
      volumes:
        - name: cs2-data
          hostPath:
            path: {{.Values.persistence.dataHostPath}}
            type: Directory
        - name: custom
          hostPath:
            path: {{.Values.persistence.customHostPath}}
            type: Directory
        - name: install-script
          configMap:
            name: {{include "cs2-server.fullname" .}}-install-script
            defaultMode: 0755
